name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          chmod +x tests/smoke_test.sh
          tests/smoke_test.sh

  build-and-release:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release artifact
        run: |
          mkdir -p dist
          tar -czf dist/scout-cli-source.tar.gz README.md install.sh docs

      - name: Upload release artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/scout-cli-source.tar.gz