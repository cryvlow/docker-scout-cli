name: Tests

on:
  push:
    branches: [ "main", "develop", "feature/Pruebas" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Give execute permission
        run: chmod +x tests/smoke_test.sh

      - name: Run smoke test
        run: tests/smoke_test.sh