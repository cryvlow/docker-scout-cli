name: Tests

on:
  push:
    branches: [ "main", "develop", "feature/Pruebas", "Metricas" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Give execute permission
        run: chmod +x tests/smoke_test.sh

      - name: Run smoke test
        run: tests/smoke_test.sh

      - name: Install kcov
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc g++ libcurl4-openssl-dev libdw-dev libiberty-dev zlib1g-dev

          git clone https://github.com/SimonKagstrom/kcov.git
          cd kcov
          mkdir build && cd build
          cmake ..
          make
          sudo make install

      - name: Run tests with coverage
        run: |
          mkdir -p coverage
          kcov --include-path=. coverage tests/smoke_test.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: Test Summary
        if: always()
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- Smoke tests ejecutados correctamente" >> $GITHUB_STEP_SUMMARY

      - name: Metricas Summary
        if: always()
        run: |
          echo "## 🧪 Test Metrics" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Métrica | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ✅ Passed |" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/*